services:
  - type: worker
    name: tsrp-government-discord-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot/main.py
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GUILD_ID
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
