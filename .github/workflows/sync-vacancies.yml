name: Sync Discord government vacancies

on:
  push:
    paths:
      - "bot/snapshot.py"
      - ".github/workflows/sync-vacancies.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vacancy-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bot dependency
        run: pip install -r requirements.txt
      - name: Read Discord roles and write vacancy data
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
        run: python bot/snapshot.py
      - name: Publish updated vacancy data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/positions.json
          if git diff --cached --quiet; then
            echo "No vacancy changes to publish."
          else
            git commit -m "Update live government vacancies"
            git push
          fi
