services:
  - type: worker
    name: tsrp-government-discord-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot/main.py
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: GUILD_ID
        sync: false
      - key: WEBSITE_SYNC_URL
        sync: false
      - key: WEBSITE_SYNC_SECRET
        sync: false
