name: Validate Cloudflare Worker

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "wrangler.jsonc"
      - "package.json"
      - ".assetsignore"
      - ".github/workflows/validate-cloudflare.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "wrangler.jsonc"
      - "package.json"
      - ".assetsignore"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npx wrangler deploy --dry-run
