name: Sync Discord government vacancies

on:
  push:
    paths:
      - "bot/snapshot.py"
      - ".github/workflows/sync-vacancies.yml"
  schedule:
    # Refresh hourly, away from the busy top of the hour.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vacancy-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bot dependency
        run: pip install -r requirements.txt
      - name: Read Discord roles and write vacancy data
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
        run: python bot/snapshot.py
      - name: Publish updated vacancy data
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/positions.json
          if git diff --cached --quiet; then
            echo "No vacancy changes to publish."
            exit 0
          fi

          git commit -m "Update live government vacancies"

          # A website or other automation may update the default branch while
          # Discord member data is being collected. Rebase the snapshot commit
          # onto the latest branch before pushing so the sync does not go stale.
          for attempt in 1 2 3; do
            git fetch origin "$TARGET_BRANCH"
            git rebase "origin/$TARGET_BRANCH"
            if git push origin "HEAD:$TARGET_BRANCH"; then
              echo "Published vacancy snapshot to $TARGET_BRANCH."
              exit 0
            fi
            echo "Push attempt $attempt lost a race; retrying against the latest $TARGET_BRANCH."
            sleep 2
          done

          echo "Could not publish vacancy snapshot after three attempts."
          exit 1
